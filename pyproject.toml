[project]
name = "python-course"
version = "0.0.0"
requires-python = "==3.14.7"
dependencies = [
    # internet
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "aiohttp==3.14.3",
    "yarl==1.24.5",

    # c bindings and compillers
    "numba==0.67.0",
    "cython==3.3.0",
    "pybind11==3.1.0",

    # data
    "scipy==1.18.1",
    "numpy==2.5.2",
    "pandas==3.0.5",

    # visualisation
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "plotly==7.0.0",

    # date and time
    "tzlocal==5.4.4",

    # serializers
    "lxml==6.1.3",
    "flatbuffers==25.12.19",
    "protobuf==7.36.1",
    "pyyaml==6.0.3",
    "pyarrow==25.0.1",

    # other stuff
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "sqlalchemy==2.0.52",
    "gitpython==3.1.61",

    # testing and linting
    "ruff==0.16.5",
    "pyrefly==1.2.0",
    "black==26.5.1",
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "requests-mock==1.12.1",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "psutil==7.2.2",

    # types
    "types-requests==2.33.0.20260712",
]

[tool.pytest.ini_options]
timeout = 60
minversion = "6.0"
python_files = "test_*.py"
addopts = "-p no:requests_mock"
testpaths = [
    "tests",
    ".tmp"
]

## mypy/pyright configs removed; Pyre is used via pyrefly.toml

[tool.ruff]
target-version = "py313"

# Enable the pycodestyle (`E`) and Pyflakes (`F`) rules by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
lint.select = ["E", "F", "W"]
lint.ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
lint.fixable = ["ALL"]
lint.unfixable = []

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",

    "tests",
    ".tmp"
]

line-length = 120

[project.optional-dependencies]
lecture = [
    "notebook>=7.2.2",  # Jupyter Notebook
]
